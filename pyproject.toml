[project]
name = "lab2-oop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TL-hash", email = "terem158@mail.ru" }
]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=1.13.2",
    "isort>=6.0.0",
    "pylint>=3.18.2",
    "coverage>=7.11.0",
    "pytest>=8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab2_oop"]

[tool.flake8]
max-line-length = 120
exclude = [
    ".venv",
    ".vscode",
    "__pycache__",
]
extend-ignore = ["E203"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.ruff]
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg", 
    ".ipynb_checkpoints", ".mypy_cache", ".nox", ".pants.d", 
    ".pyenv", ".pytest_cache", ".pytype", ".ruff_cache", ".svn", 
    ".tox", ".venv", ".vscode", "__pypackages__", "_build", 
    "buck-out", "build", "dist", "node_modules", "site-packages", "venv",
]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]